    <line x1="590" y1="175" x2="680" y2="175"/>
    <polygon points="680,175 666,167 666,183" fill="#333333" stroke="none"/>
  </g>
  <g id="labels" font-family="Arial, sans-serif" font-size="20" fill="#111111">
    <text x="90" y="180">Input / trigger</text>
    <text x="405" y="180">Mechanism</text>
    <text x="720" y="180">Outcome</text>
  </g>
